version: "3.9"

services:
  db:
    env_file:
      - .env.dev
    image: farlo0nn/secret-santa-db:latest
    container_name: secret_santa_db_dev
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - db_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    

  bot:
    image: farlo0nn/secret-santa:latest
    container_name: secret_santa_bot_dev
    depends_on:
      - db
    env_file:
      - .env.dev
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PORT: ${DB_PORT}
      DB_PASSWORD: ${DB_PASSWORD}
      TG_TOKEN: ${TG_TOKEN}
    volumes:
      - .:/app  
    restart: on-failure 
    command: >
      sh -c "
        uv run alembic upgrade head &&
        uv run bot
      "
    ports:
      - "8000:8000"

volumes:
  db_data_dev:
